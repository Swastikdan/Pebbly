packages: []
minimumReleaseAge: 10080
trustPolicy: no-downgrade
trustPolicyExclude:
  - chokidar
  - semver
  - undici-types
  - "@hono/node-server"
overrides:
  "uuid@<11.1.1": ">=11.1.1"
  "esbuild@<0.25.0": ">=0.25.0"
allowBuilds:
  "@clerk/shared": true
  "@parcel/watcher": true
  "@tailwindcss/oxide": true
  browser-tabs-lock: true
  bufferutil: false
  core-js: false
  esbuild: true
  protobufjs: true
  utf-8-validate: false
  workerd: false
