name: CI Checks
on:
  pull_request:
    branches:
      - cloudflare
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (node24 runtime)
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6 (node24 runtime)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7 (node24 runtime)
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build (Nitro cloudflare preset)
        run: pnpm build
        env:
          # Public build-time values only — the same VITE_* vars the deploy
          # job inlines into the client bundle. No Cloudflare secrets.
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_PUBLIC_TMDB_ACCESS_TOKEN: ${ secrets.VITE_PUBLIC_TMDB_ACCESS_TOKEN }
          # Branding/canonical-URL switch (see src/constants.ts IS_PREVIEW_BUILD)
          VITE_PUBLIC_APP_ENV: production
          VITE_PUBLIC_TMDB_API_URL: ${{ secrets.VITE_PUBLIC_TMDB_API_URL }}
          VITE_PUBLIC_VIDEO_URL: ${{ secrets.VITE_PUBLIC_VIDEO_URL }}

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (node24 runtime)
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6 (node24 runtime)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7 (node24 runtime)
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      - name: Dependency audit (prod tree)
        run: pnpm audit --prod

      - name: Secret scan (full git history)
        env:
          SECRET_PATTERN: >-
            (sk_(test|live)_[A-Za-z0-9]{16,}|sk-ant-[A-Za-z0-9]{10,}|AIza[A-Za-z0-9_-]{30,}|ghp_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{30,}|xox[bp]-[A-Za-z0-9]{10,})
        run: |
          if git rev-list --all | xargs -n 50 git grep -lIE "$SECRET_PATTERN" > /tmp/secrets.txt; then
            echo "::error::Potential secrets found in history:"
            cat /tmp/secrets.txt
            exit 1
          fi
          echo "No secret patterns found in history"
