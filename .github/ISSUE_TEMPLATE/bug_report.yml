name: Bug report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! Please search
        existing issues first to avoid duplicates.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect to happen, and what actually happened?
      placeholder: |
        Describe the bug. Include the page/route and what you were doing when
        it occurred (e.g. "On the TV series page, scrolling the season list...").
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: How can we reproduce the issue?
      placeholder: |
        1. Go to ...
        2. Click on ...
        3. Scroll to ...
        4. See error
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Page / URL
      description: The route where the bug occurs, if applicable
  - type: dropdown
    id: device
    attributes:
      label: Device
      description: What device are you on?
      options:
        - Desktop
        - Mobile / Tablet
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome
        - Firefox
        - Safari
        - Edge
        - Other
  - type: textarea
    id: console
    attributes:
      label: Console / network errors
      description: Paste any relevant console errors, network failures, or warnings.
      render: shell
  - type: textarea
    id: additional
    attributes:
      label: Anything else?
      description: Screenshots, screen recordings, or additional context.
