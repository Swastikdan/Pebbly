name: Feature request
description: Suggest an idea or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please search existing issues first
        to avoid duplicates.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the pain point or missing capability you're experiencing.
      placeholder: |
        Example: "There's no way to filter my watchlist by genre, so it's hard
        to find something to watch."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the feature you'd like, and how it should behave.
      placeholder: |
        Example: "Add a genre filter dropdown to the watchlist page that
        filters the list client-side."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds or alternative approaches you've tried.
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Screenshots, mockups, or links that help explain the request.
