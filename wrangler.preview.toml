# Cloudflare Workers + D1 (preview environment for cf-* branches)
name = "pebbly-preview"
main = ".output/server/index.mjs"
compatibility_date = "2026-08-08"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Frontend static assets served from the edge
[assets]
directory = ".output/public"
binding = "ASSETS"

[vars]
# Non-secret flag so the app can detect it is running in preview at runtime.
APP_ENV = "preview"

# Preview D1 database (separate from production)
[[d1_databases]]
binding = "DB"
database_name = "pebbly-preview"
database_id = "5b4796fa-e49e-4802-a4bc-19c1596cf303"
migrations_dir = "drizzle"

[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = true
